name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build archives and Linux installers
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Require a supported release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH, optionally with a prerelease suffix' >&2
            exit 1
          fi
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: check
      - name: Build tagged packages
        if: github.ref_type == 'tag'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean --skip=publish
      - name: Build snapshot packages
        if: github.ref_type != 'tag'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=publish
      - name: Smoke-test Linux archive and Debian package
        run: |
          mkdir -p smoke/archive smoke/deb
          archive=(dist/*_linux_amd64.tar.gz)
          deb=(dist/*_linux_amd64.deb)
          tar -xzf "${archive[0]}" -C smoke/archive slackline
          smoke/archive/slackline --version
          dpkg-deb --extract "${deb[0]}" smoke/deb
          smoke/deb/usr/bin/slackline --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-packages
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/metadata.json

  macos:
    name: macOS installer (${{ matrix.arch }})
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: base-packages
          path: dist
      - name: Build installer
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("dist/metadata.json"))["version"])')
          archives=(dist/*_darwin_"$TARGET_ARCH".tar.gz)
          scripts/package-macos.sh "${archives[0]}" "$version" dist
      - name: Verify installer payload
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          packages=(dist/*_darwin_"$TARGET_ARCH".pkg)
          pkgutil --payload-files "${packages[0]}" | grep -q 'usr/local/bin/slackline'
          archives=(dist/*_darwin_"$TARGET_ARCH".tar.gz)
          mkdir -p smoke
          tar -xzf "${archives[0]}" -C smoke slackline
          file smoke/slackline
          if [[ "$TARGET_ARCH" == arm64 && "$(uname -m)" == arm64 ]] || [[ "$TARGET_ARCH" == amd64 && "$(uname -m)" == x86_64 ]]; then
            smoke/slackline --version
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 14

  collect:
    name: Assemble downloads and checksums
    needs: [build, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*packages'
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true
      - name: Generate and verify SHA-256 checksums
        run: |
          python3 scripts/checksums.py dist
          cd dist
          sha256sum --check checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slackline-installers
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg
            dist/checksums.txt

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: collect
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slackline-installers
          path: dist
      - name: Publish all installers together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" dist/*
