name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Verify dependencies
        run: go mod verify
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Test optional browser helper
        run: node --test browser-extension/tests/background.test.cjs
      - name: Build and smoke-test
        env:
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -o bin/slackline ./cmd/slackline
          ./bin/slackline --version
          ./bin/slackline --help
